// WattWise Android — root project build file.
// AGP 8.3.2 requires Gradle 8.4+; we pin Gradle 8.5 (see gradle/wrapper/gradle-wrapper.properties).
plugins {
    id 'com.android.application' version '8.3.2' apply false
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}