plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wattwise.android'
    compileSdk 34

    defaultConfig {
        applicationId "com.wattwise.android"
        // java.time está disponible de forma nativa desde API 26, por lo que no se requiere desugaring.
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            // 10.0.2.2 = el loopback de la máquina host visto desde el emulador de Android.
            buildConfigField "String", "API_BASE_URL", "\"http://10.0.2.2:8080\""
            minifyEnabled false
        }
        release {
            // URL de producción de ejemplo; apunta esto al host real de despliegue.
            buildConfigField "String", "API_BASE_URL", "\"https://api.wattwise.example\""
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
        warningsAsErrors false
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }
}

dependencies {
    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Room (ORM de SQLite) — procesamiento de anotaciones de Java.
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // WorkManager (sync periódico + programación de notificaciones de precio).
    implementation 'androidx.work:work-runtime:2.9.0'

    // EncryptedSharedPreferences para el JWT + ids de usuario.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Red: Retrofit 2 + OkHttp + Gson.
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Tests unitarios (solo JVM — los repositorios/DAOs requieren Robolectric o instrumentación;
    // las clases de lógica pura probadas aquí no tienen dependencias de Android).
    testImplementation 'junit:junit:4.13.2'
}