# =============================================================================
# WattWise — minimal Grafana configuration.
# Authentication and admin credentials come from environment:
#   GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD
# (set them in your .env; defaults are admin/admin — CHANGE in production).
# =============================================================================

[server]
# Bind all interfaces inside the container.
http_addr = 0.0.0.0
http_port = 3000

[security]
# Allow anonymous read-only access to the dashboards so the team can view
# the operational dashboards without logging in.
allow_anonymous = true
anonymous_org_name = Main Org. (org 1)

[users]
allow_sign_up = false
auto_assign_org_role = Viewer

[auth.anonymous]
# Enabled via [security] allow_anonymous; keep viewer role only.
org_name = Main Org. (org 1)
org_role = Viewer

[log]
mode = console
level = info