# =============================================================================
# WattWise — configuración mínima de Grafana.
# La autenticación y las credenciales de admin provienen del entorno:
#   GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD
# (defínelas en tu .env; por defecto son admin/admin — CÁMBIALAS en producción).
# =============================================================================

[server]
# Vincula todas las interfaces dentro del contenedor.
http_addr = 0.0.0.0
http_port = 3000

[security]
# Permite acceso anónimo de solo lectura a los dashboards para que el equipo
# pueda ver los dashboards operativos sin iniciar sesión.
allow_anonymous = true
anonymous_org_name = Main Org. (org 1)

[users]
allow_sign_up = false
auto_assign_org_role = Viewer

[auth.anonymous]
# Habilitado vía [security] allow_anonymous; mantén solo el rol viewer.
org_name = Main Org. (org 1)
org_role = Viewer

[log]
mode = console
level = info