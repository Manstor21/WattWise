# =============================================================================
# WattWise — aprovisionamiento del datasource de Grafana.
# El id único "prometheus" es referenciado por todos los paneles de los dashboards JSON.
# =============================================================================

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false