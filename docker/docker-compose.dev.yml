# =============================================================================
# WattWise — overrides para desarrollo local.
#
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml up -d --build
#
# Cambios respecto al stack base:
#   * backend  -> perfil `dev` de Spring respaldado por un archivo SQLite montado desde ./data
#                 (sin necesidad de SQL Server; Flyway permanece deshabilitado según application-dev.yml)
#   * sql-server -> excluido por defecto (tiene un perfil de compose inactivo).
#                   Llévalo arriba explícitamente cuando lo necesites:
#                   docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml --profile sql-server up -d
#   * backend y analytics usan SQLite-first en dev (sin espera a SQL Server).
#   * backend publica 8080 en el host para acceso directo a Actuator/Swagger mientras se depura.
#
# SQLite conserva el estado en docker/data/ (ignorado por git en la raíz del repo).
# Borra el archivo para reiniciar tu base de datos local.
# =============================================================================

services:
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:sqlite:./data/wattwise.db
      DB_USERNAME: ""
      DB_PASSWORD: ""
    volumes:
      - ./data:/app/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  analytics-python:
    # Respaldado por SQLite para un run de dev sin SQL Server; SQLAlchemy resuelve
    # SQLite vía la DATABASE_URL de abajo (auto-creación de tablas en app/main.py).
    environment:
      DATABASE_URL: sqlite:////app/data/wattwise-analytics.db
    volumes:
      - ./data:/app/data

  sql-server:
    profiles: ["sql-server"]