# =============================================================================
# WattWise — Blackbox Exporter config.
# Used to probe services that do not expose a Prometheus /metrics endpoint:
#   * nginx http probe on port 80
#   * SQL Server TCP connect probe on 1433
#   * Prometheus /-/healthy
#   * Grafana /api/health
# Produces probe_success, which the Overview dashboard uses for all 6 services.
# =============================================================================

modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      follow_redirects: false
      preferred_ip_protocol: ip4
      valid_status_codes: [200, 301, 302]

  tcp_connect:
    prober: tcp
    timeout: 5s