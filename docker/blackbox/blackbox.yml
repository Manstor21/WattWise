# =============================================================================
# WattWise — config de Blackbox Exporter.
# Se usa para sondear los servicios que no exponen un endpoint /metrics de Prometheus:
#   * sonda http de nginx en el puerto 80
#   * sonda de conexión TCP de SQL Server en 1433
#   * Prometheus /-/healthy
#   * Grafana /api/health
# Produce probe_success, que el dashboard Overview usa para los 6 servicios.
# =============================================================================

modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      follow_redirects: false
      preferred_ip_protocol: ip4
      valid_status_codes: [200, 301, 302]

  tcp_connect:
    prober: tcp
    timeout: 5s