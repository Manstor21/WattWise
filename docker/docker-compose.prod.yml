# =============================================================================
# WattWise — overrides para producción.
#
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d --build
#
# Añade límites de recursos y políticas de reinicio a cada servicio. Todas las
# credenciales deben suministrarse mediante un archivo docker/.env (ver .env.example)
# o los secretos del orquestador.
# =============================================================================

services:
  nginx:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  backend:
    restart: always
    depends_on:
      sql-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  sql-server:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 1G

  analytics-python:
    restart: always
    depends_on:
      sql-server:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  prometheus:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  grafana:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  blackbox-exporter:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M