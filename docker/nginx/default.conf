# =============================================================================
# WattWise — server block.
#   * sirve la SPA estática desde /usr/share/nginx/html
#   * proxifica /api/* y /actuator/* hacia el backend (Spring Boot)
#   * /api/ NO se cachea; los assets estáticos se cachean 1h.
# =============================================================================

server {
    listen       80;
    server_name  localhost;

    root  /usr/share/nginx/html;
    index index.html;

    # ---- Cabeceras de seguridad (defensa en profundidad) ----
    # CSP: scripts solo desde self + el CDN de jQuery con SRI fijado; sin scripts
    # inline (jquery-fallback.js ahora es externo). Los estilos permiten inline
    # porque las plantillas usan style="" con variables CSS.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://code.jquery.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://code.jquery.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Raíz amigable con las health probes (usada por los checks upstream de Nginx).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # ---- Proxy inverso hacia el backend Spring Boot ----
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Las respuestas de la API no deben ser cacheadas por nginx.
        expires -1;
        add_header Cache-Control "no-store";
    }

    location /actuator/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        expires -1;
        add_header Cache-Control "no-store";
    }

    # ---- SPA estática (fallback de history HTML5 a index.html) ----
    location / {
        try_files $uri $uri/ /index.html;
        # Cachea los assets estáticos durante 1h.
        expires 1h;
        add_header Cache-Control "public";
    }
}