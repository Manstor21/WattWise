# =============================================================================
# WattWise — server block.
#   * serves the static SPA from /usr/share/nginx/html
#   * proxies /api/* and /actuator/* to the backend (Spring Boot)
#   * /api/ gets NO caching; static assets are cached 1h.
# =============================================================================

server {
    listen       80;
    server_name  localhost;

    root  /usr/share/nginx/html;
    index index.html;

    # Health-probe-friendly root (used by Nginx upstream checks).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # ---- Reverse proxy to Spring Boot backend ----
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # API responses must not be cached by nginx.
        expires -1;
        add_header Cache-Control "no-store";
    }

    location /actuator/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        expires -1;
        add_header Cache-Control "no-store";
    }

    # ---- Static SPA (HTML5 history fallback to index.html) ----
    location / {
        try_files $uri $uri/ /index.html;
        # Cache static assets for 1h.
        expires 1h;
        add_header Cache-Control "public";
    }
}