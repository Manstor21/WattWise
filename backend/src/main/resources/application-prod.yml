# WattWise — perfil prod: SQL Server
spring:
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=wattwise;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:wattwise}
    password: ${DB_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Sin baseline: el bootstrap de SQL Server de compose crea una base de datos vacía,
    # por lo que Flyway debe aplicar V1..Vn desde cero. Un baseline con su versión
    # por defecto (1) marcaría V1 como ya aplicada y omitiría el esquema.
    baseline-on-migrate: false

# Falla rápido si falta JWT_SECRET en producción: un secreto vacío/débil
# permitiría a cualquiera forjar tokens. JwtConfig valida que tenga >= 32 caracteres.
wattwise:
  security:
    jwt-secret: ${JWT_SECRET:}

logging:
  level:
    com.wattwise: INFO
