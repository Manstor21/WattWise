# WattWise — prod profile: SQL Server
spring:
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=wattwise;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:wattwise}
    password: ${DB_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Fail fast if JWT_SECRET is missing in production: an empty/weak secret
# would let anyone forge tokens. JwtConfig validates >= 32 chars.
wattwise:
  security:
    jwt-secret: ${JWT_SECRET:}

logging:
  level:
    com.wattwise: INFO
