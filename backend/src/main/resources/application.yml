# WattWise Backend — configuración base
# Los ajustes específicos por perfil están en application-dev.yml (SQLite) y application-prod.yml (SQL Server).
# Activa un perfil con: SPRING_PROFILES_ACTIVE=dev|prod  (o -Dspring-boot.run.profiles=dev)

spring:
  application:
    name: wattwise-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Detalles solo para principales autenticados; los llamantes anónimos
      # ven {status: UP}. Mantiene los detalles internos de BD/disco fuera de los
      # probes no autenticados, sin dejar de ser compatible con healthcheck.
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# ---------------------------------------------------------------------------
# Configuración de dominio WattWise
# ---------------------------------------------------------------------------
wattwise:
  security:
    # Sobrescríbela con la variable de entorno JWT_SECRET (>= 32 caracteres). El valor por defecto solo se usa para dev/demo local, NUNCA en producción.
    jwt-secret: ${JWT_SECRET:ZmFrZS1kZXZlbG9wbWVudC1zZWNyZXQtY2hhbmdlLWluLXByb2R1Y3Rpb24tbG9uZy1zZWNyZXQ=}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  esios:
    # API pública de ESIOS — los datos básicos no requieren token, pero la cabecera es configurable.
    base-url: ${ESIOS_BASE_URL:https://apidatos.ree.es/es/datos/mercados/precios-mercados-tiempo-real}
    api-token: ${ESIOS_API_TOKEN:}
    connect-timeout-ms: ${ESIOS_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${ESIOS_READ_TIMEOUT_MS:30000}
    retry:
      max-attempts: 3
      initial-backoff-ms: 2000
      max-backoff-ms: 30000
  scheduler:
    # Formato cron: seg min hora día mes día de la semana. 0 15 20 * * * = 20:15:00 todos los días.
    price-fetch-cron: ${PRICE_FETCH_CRON:0 15 20 * * *}
    enabled: ${PRICE_FETCH_ENABLED:true}
  traffic-light:
    # Capa 1: límites del percentil diario (0,0-1,0)
    percentile-green-max: 0.33
    percentile-red-min: 0.67
    # Capa 2: desviación respecto a la media diaria (decimal, p. ej. -0.25 => 25 % por debajo de la media)
    deviation-green-max: -0.25
    deviation-red-min: 0.25
    # Capa 3: umbrales de contexto absoluto del precio (EUR/kWh)
    absolute-green-max: 0.10
    absolute-amber-max: 0.20
    absolute-red-min: 0.20
    # Detección de día uniforme: coeficiente de variación (desv. estándar/media)
    uniform-day-cv-threshold: 0.10
    # Suavizado de bordes (eliminación de islas)
    smoothing-enabled: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173,http://localhost:80,http://localhost:3000}
