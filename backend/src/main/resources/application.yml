# WattWise Backend — base configuration
# Profile-specific settings live in application-dev.yml (SQLite) and application-prod.yml (SQL Server).
# Activate a profile via: SPRING_PROFILES_ACTIVE=dev|prod  (or -Dspring-boot.run.profiles=dev)

spring:
  application:
    name: wattwise-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Details only for authenticated principals; anonymous callers
      # see {status: UP}. Keeps DB/disk internals out of unauthenticated
      # probes while remaining healthcheck-friendly.
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# ---------------------------------------------------------------------------
# WattWise domain configuration
# ---------------------------------------------------------------------------
wattwise:
  security:
    # Override with env var JWT_SECRET (>= 32 chars). Default used only for local dev / demo, NEVER production.
    jwt-secret: ${JWT_SECRET:ZmFrZS1kZXZlbG9wbWVudC1zZWNyZXQtY2hhbmdlLWluLXByb2R1Y3Rpb24tbG9uZy1zZWNyZXQ=}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  esios:
    # Public ESIOS API — basic data does not require a token, but the header is configurable.
    base-url: ${ESIOS_BASE_URL:https://apidatos.ree.es/es/datos/mercados/precios-mercados-tiempo-real}
    api-token: ${ESIOS_API_TOKEN:}
    connect-timeout-ms: ${ESIOS_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${ESIOS_READ_TIMEOUT_MS:30000}
    retry:
      max-attempts: 3
      initial-backoff-ms: 2000
      max-backoff-ms: 30000
  scheduler:
    # Cron format: sec min hour day month weekday. 0 15 20 * * * = 20:15:00 every day.
    price-fetch-cron: ${PRICE_FETCH_CRON:0 15 20 * * *}
    enabled: ${PRICE_FETCH_ENABLED:true}
  traffic-light:
    # Layer 1: daily percentile boundaries (0.0-1.0)
    percentile-green-max: 0.33
    percentile-red-min: 0.67
    # Layer 2: deviation from daily mean (decimal, e.g. -0.25 => 25% below mean)
    deviation-green-max: -0.25
    deviation-red-min: 0.25
    # Layer 3: absolute price context thresholds (EUR/kWh)
    absolute-green-max: 0.10
    absolute-amber-max: 0.20
    absolute-red-min: 0.20
    # Uniform day detection: coefficient of variation (stddev/mean)
    uniform-day-cv-threshold: 0.10
    # Edge smoothing (island removal)
    smoothing-enabled: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173,http://localhost:80,http://localhost:3000}
