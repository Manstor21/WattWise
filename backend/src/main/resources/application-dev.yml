# WattWise — perfil dev: base de datos SQLite local (sin configuración previa)
spring:
  datasource:
    url: jdbc:sqlite:./data/wattwise.db
    driver-class-name: org.sqlite.JDBC
    username:
    password:
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      # SQLite tiene soporte DDL limitado; Hibernate crea las tablas a partir de las entidades cuando ddl-auto=update.
      # Las migraciones de Flyway NO se habilitan en el perfil dev porque las diferencias de DDL de SQLite
      # con SQL Server hacen incómodo un único conjunto de migraciones multi-dialecto. El esquema de SQL Server
      # es la fuente de verdad (V1__init.sql / V2__seed_catalog.sql) para prod.
      ddl-auto: update
  flyway:
    enabled: false

logging:
  level:
    com.wattwise: DEBUG
    org.hibernate.SQL: DEBUG
