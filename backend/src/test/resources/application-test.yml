spring:
  datasource:
    url: jdbc:h2:mem:wattwise-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    # Tests use H2 in-memory; SQL Server dialect migrations are not applicable here.
    enabled: false

wattwise:
  scheduler:
    enabled: false