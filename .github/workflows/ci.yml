name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test and verify (JaCoCo coverage gate)
        run: mvn -B verify
        working-directory: backend
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-backend
          path: backend/target/site/jacoco
          retention-days: 7

  analytics:
    name: Analytics (Python / Flask)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: analytics-python/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: analytics-python
      - name: Run tests
        run: python -m pytest -q
        working-directory: analytics-python

  desktop-admin:
    name: Desktop Admin (Swing)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test and package
        run: mvn -B verify
        working-directory: desktop-admin

  android:
    name: Android (unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: android
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --console=plain
        working-directory: android

  web:
    name: Web (static smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Serve and smoke-test the static dashboard
        run: |
          cd web
          python -m http.server 8090 --bind 127.0.0.1 &
          SERVER_PID=$!
          sleep 2
          curl -fsS http://127.0.0.1:8090/ -o /tmp/index.html
          curl -fsS http://127.0.0.1:8090/login.html -o /tmp/login.html
          grep -qi 'wattwise' /tmp/index.html
          kill $SERVER_PID

  docker:
    name: Docker (compose + image builds)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ backend, analytics, desktop-admin, android, web ]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
        working-directory: docker
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build analytics image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/analytics-python/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max